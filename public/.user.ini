; Raises PHP's own upload ceiling above what this app's validation rules
; already allow (StoreProductRequest/UpdateProductRequest: primary/gallery
; images up to 5 MB each, certificate up to 10 MB, up to 10 gallery images
; per product). Without this, PHP can reject an upload before Laravel's own
; size/type checks ever run — surfacing as Laravel's generic built-in
; "The Primary Image failed to upload." message instead of a real
; validation error, which is exactly the symptom this file fixes.
;
; Only takes effect under PHP-FPM/CGI (the common case on shared hosting).
; Under Apache's mod_php, .user.ini is silently ignored — raise
; upload_max_filesize/post_max_size directly in php.ini instead.
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20
